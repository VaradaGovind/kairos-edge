experiment:
  name: baseline_optimized_chunked_prefill
  seed: 3407
  output_dir: logs/benchmarks
  power_budget_file: configs/power_matched_budget.yaml

server:
  host: 127.0.0.1
  port: 8000
  base_url: http://127.0.0.1:8000
  endpoint: /v1/completions
  api_key: ""

model:
  id: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  revision: main
  precision: bf16
  backend: vllm

runtime:
  max_tokens: 96
  temperature: 0.0
  top_p: 1.0
  warmup_requests: 2
  measurement_requests: 8
  request_timeout_s: 180
  gpu_mem_poll_interval_s: 0.25

hardware_throttling:
  board_power_cap_w: 250.0
  dvfs_step_limit_mv: 25.0
  thermal_guardrail_c: 85.0
  thermal_critical_c: 90.0

batch_rules:
  max_tokens: 96
  temperature: 0.0
  top_p: 1.0
  warmup_requests: 2
  measurement_requests: 8

kairos_latency_hiding:
  chunk_size_tokens: 384
  compute_s_per_token: 0.00035
  nvme_serialize_s_per_token: 0.00018
  nvme_setup_latency_s: 0.004
  decode_horizon_steps: 128
  pcie_rtt_s: 0.0032
  pcie_transfer_s_per_mb: 0.00058
  page_size_tokens: 128

evaluation:
  weights:
    ttft: 0.47
    tpot: 0.45
    throughput: 0.06
    power: 0.02
  targets:
    ttft_p95_s: 0.85
    tpot_p95_s: 0.85
    throughput_tps: 1.25
    power_proxy_w: 240.0
  asserts:
    max_ttft_p95_s: 20.00
    max_tpot_p95_s: 20.00
    max_weighted_cost: 2.10

workload:
  prompts:
    - Explain why KV cache memory grows with context length in transformer decoding.
    - Summarize a 3-step strategy to reduce TTFT without harming accuracy.
    - Given a thermal warning at 85C, describe proactive migration actions for HBM headroom.
    - Compare compute-bound and memory-bound phases for LLM inference scheduling.
  expected_answers:
    - KV cache grows with generated token count because each new token contributes new key/value states.
    - TTFT can improve through prompt chunking, tighter batching, and overlap of prefill with data movement.
    - Proactive migration should create destination HBM headroom before transfer, then move hot pages in controlled windows.
    - Compute-bound phases stress SM compute units while memory-bound phases are dominated by cache and bandwidth pressure.

baseline_profile:
  name: optimized_chunked_prefill
  description: Static chunked prefill baseline for reduced prefill memory spikes.
  vllm_server_args:
    gpu_memory_utilization: 0.92
    max_model_len: 4096
    max_num_batched_tokens: 4096
    enable_chunked_prefill: true

fairness:
  expected:
    model_id: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    model_revision: main
    precision: bf16
    baseline_profile_name: optimized_chunked_prefill
    baseline_enable_chunked_prefill: true
    baseline_gpu_memory_utilization: 0.92
    baseline_max_num_batched_tokens: 4096
    hardware_throttling:
      board_power_cap_w: 250.0
      dvfs_step_limit_mv: 25.0
      thermal_guardrail_c: 85.0
      thermal_critical_c: 90.0
    batch_rules:
      max_tokens: 96
      temperature: 0.0
      top_p: 1.0
      warmup_requests: 2
      measurement_requests: 8
    workload_hash: 3e1d4e6bdfaa7bd4dfaaed5d9d312cdaecca7c11991f17b1ebcd27dba5ddf5b7
    workload_settings:
      max_tokens: 96
      temperature: 0.0
      top_p: 1.0
      warmup_requests: 2
      measurement_requests: 8
